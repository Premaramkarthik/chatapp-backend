name: paripath-production
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    networks:
    - private
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Required}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 5s
      retries: 12
  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    networks:
    - private
    - egress
    command:
    - start
    - --optimized
    environment:
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Required}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Required}
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    networks:
    - private
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
  api:
    build: .
    networks:
    - private
    - egress
    environment: &id001
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: chatapp
      DB_NAME: chatapp
      DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      KEYCLOAK_ENABLED: 'true'
      KEYCLOAK_AUTO_BOOTSTRAP: 'false'
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080/identity
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_URL:?Required}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Required}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Required}
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:?Required}
      AUTH_COOKIE_SECURE: 'true'
      AUTH_CALLBACK_URL: ${API_PUBLIC_URL:?Required}/v1/auth/signin/callback
      AUTH_DEFAULT_POST_SIGNIN_REDIRECT_URL: ${APP_PUBLIC_URL:?Required}/auth/callback
      AUTH_POST_LOGOUT_REDIRECT_URL: ${APP_PUBLIC_URL:?Required}/
      AUTH_ALLOWED_REDIRECT_ORIGINS: ${APP_PUBLIC_URL:?Required}
      MIDDLEWARE_CORS_ORIGINS: ${APP_PUBLIC_URL:?Required}
      REDIS_URL: redis://redis:6379/0
      TYPESENSE_ENABLED: 'true'
      TYPESENSE_HOST: typesense
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Required}
      MATRIX_ENABLED: 'true'
      MATRIX_OIDC_CLIENT_SECRET: ${MATRIX_OIDC_CLIENT_SECRET:?Required}
      MATRIX_CALLBACK_URL: ${API_PUBLIC_URL:?Required}/v1/chat/matrix/callback
      MATRIX_POST_LOGIN_URL: ${APP_PUBLIC_URL:?Required}/chat
      MATRIX_HOMESERVER_URL: http://synapse:8008
      MATRIX_PUBLIC_HOMESERVER_URL: ${MATRIX_PUBLIC_URL:?Required}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Required}
      MATRIX_SERVICE_ADMIN_PASSWORD: ${MATRIX_SERVICE_ADMIN_PASSWORD:?Required}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?Required}
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    build: .
    profiles:
    - maintenance
    networks:
    - private
    environment: *id001
    command:
    - uv
    - run
    - python
    - scripts/run_migrations.py
    depends_on:
      postgres:
        condition: service_healthy
  synapse-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    networks:
    - private
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Required}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
    - synapse_db_data:/var/lib/postgresql/data
  synapse:
    image: matrixdotorg/synapse:latest@sha256:abeb932f2a9293fcbb886d5ddd0f55a34d532708ebb8dc5642934dd91ca26237
    networks:
    - private
    - egress
    entrypoint:
    - /bin/sh
    - -c
    - python /config/render_config.py /config/homeserver.yaml /data/homeserver.yaml
      && exec /start.py
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Required}
      MATRIX_PUBLIC_URL: ${MATRIX_PUBLIC_URL:?Required}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Required}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?Required}
      PYTHONPATH: /config
      MATRIX_MACAROON_SECRET: ${MATRIX_MACAROON_SECRET:?Required}
      MATRIX_FORM_SECRET: ${MATRIX_FORM_SECRET:?Required}
      MATRIX_OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:?Required}/realms/chatapp
      MATRIX_OIDC_CLIENT_SECRET: ${MATRIX_OIDC_CLIENT_SECRET:?Required}
      MATRIX_CALLBACK_URL: ${API_PUBLIC_URL:?Required}/v1/chat/matrix/callback
    volumes:
    - synapse_data:/data
    - ./docker/synapse/homeserver.production.yaml:/config/homeserver.yaml:ro
    - ./docker/synapse/render_config.py:/config/render_config.py:ro
    - ./docker/synapse/log.config:/data/log.config:ro
    - ./docker/synapse/matrix_log_redaction.py:/config/matrix_log_redaction.py:ro
    depends_on:
    - synapse-db
    - redis
  typesense:
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    networks:
    - private
    command:
    - --data-dir
    - /data
    - --api-key=${TYPESENSE_API_KEY:?Required}
    volumes:
    - typesense_data:/data
  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    networks:
    - private
    - ingress
    ports:
    - 443:443
    volumes:
    - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    - ${TLS_CERT_FILE:?Required}:/run/tls/cert.pem:ro
    - ${TLS_KEY_FILE:?Required}:/run/tls/key.pem:ro
    depends_on:
    - api
    - keycloak
    - synapse
networks:
  private:
    internal: true
  egress: {}
  ingress: {}
volumes:
  postgres_data: {}
  synapse_db_data: {}
  synapse_data: {}
  redis_data: {}
  typesense_data: {}
