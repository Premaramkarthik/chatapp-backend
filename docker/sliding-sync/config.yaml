# Deprecated: latest sliding-sync image uses SYNCV3_* env vars (see docker-compose.yml).
# Sliding Sync proxy (MSC3575) — connects to Synapse for scalable client sync.
http:
  addr: ":8090"
  cors:
    allowed_origins:
      - "http://localhost:8080"
      - "http://localhost:5173"
      - "http://localhost:3000"

sync_server:
  database:
    connection_string: postgres://synapse:synapse@synapse-db:5432/synapse?sslmode=disable
  server: http://synapse:8008
