server {
 access_log off; # SSO loginToken and OIDC codes must never enter access logs.
 listen 443 ssl;
 ssl_certificate /run/tls/cert.pem;
 ssl_certificate_key /run/tls/key.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-For $remote_addr;
 location /api/v1/auth/internal/ { return 404; }
 location /api/ { proxy_pass http://api:8000/; }
 location /identity/admin/ { return 404; }
 location /identity/ { proxy_pass http://keycloak:8080; }
 location /_synapse/client/ { proxy_pass http://synapse:8008; }
 location /_matrix/ { proxy_pass http://synapse:8008; }
 location /_synapse/ { return 404; }
 location / { return 404; }
}
