name: veliqone-production
services:
  pgbouncer:
    image: percona/percona-pgbouncer:1.26.0
    networks:
    - private
    - egress
    environment:
      DB_USER: chatapp
      DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      DB_NAME: chatapp
      POSTGRES_HOST: ${POSTGRES_HOST:?Required}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGBOUNCER_PORT: '6432'
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-10}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
    entrypoint:
    - /bin/sh
    - /docker/pgbouncer/start.sh
    volumes:
    - ./deployment/pgbouncer/start.sh:/docker/pgbouncer/start.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p 6432 -U chatapp -d chatapp
      interval: 5s
      timeout: 5s
      retries: 12
  keycloak:
    build:
      context: .
      dockerfile: deployment/keycloak/Dockerfile
    networks:
    - private
    - egress
    command:
    - start
    - --optimized
    environment:
      KC_DB_URL_HOST: ${POSTGRES_HOST:?Required}
      KC_DB_URL_PORT: ${POSTGRES_PORT:-5432}
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Required}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Required}
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    networks:
    - private
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
    - sh
    - -c
    - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    networks:
    - private
    - egress
    environment: &id001
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: ${POSTGRES_HOST:?Required}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_TARGET: pgbouncer
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: '6432'
      DB_USER: chatapp
      DB_NAME: chatapp
      DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      KEYCLOAK_ENABLED: 'true'
      KEYCLOAK_AUTO_BOOTSTRAP: 'false'
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080/identity
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_URL:?Required}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Required}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Required}
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:?Required}
      AUTH_COOKIE_SECURE: 'true'
      AUTH_CALLBACK_URL: ${API_PUBLIC_URL:?Required}/v1/auth/signin/callback
      AUTH_DEFAULT_POST_SIGNIN_REDIRECT_URL: ${APP_PUBLIC_URL:?Required}/auth/callback
      AUTH_POST_LOGOUT_REDIRECT_URL: ${APP_PUBLIC_URL:?Required}/
      AUTH_ALLOWED_REDIRECT_ORIGINS: ${APP_PUBLIC_URL:?Required}
      MIDDLEWARE_CORS_ORIGINS: ${APP_PUBLIC_URL:?Required}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TYPESENSE_ENABLED: 'true'
      TYPESENSE_HOST: typesense
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Required}
      MATRIX_ENABLED: 'true'
      MATRIX_OIDC_CLIENT_SECRET: ${MATRIX_OIDC_CLIENT_SECRET:?Required}
      MATRIX_CALLBACK_URL: ${API_PUBLIC_URL:?Required}/v1/chat/matrix/callback
      MATRIX_POST_LOGIN_URL: ${APP_PUBLIC_URL:?Required}/chat
      MATRIX_HOMESERVER_URL: http://synapse:8008
      MATRIX_PUBLIC_HOMESERVER_URL: ${MATRIX_PUBLIC_URL:?Required}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Required}
      MATRIX_SERVICE_ADMIN_PASSWORD: ${MATRIX_SERVICE_ADMIN_PASSWORD:?Required}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?Required}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
  migrate:
    build: .
    profiles:
    - maintenance
    networks:
    - private
    - egress
    environment:
      <<: *id001
      DB_TARGET: direct
    command:
    - uv
    - run
    - python
    - scripts/run_migrations.py
  synapse-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    networks:
    - private
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Required}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
    - synapse_db_data:/var/lib/postgresql/data
  synapse:
    image: matrixdotorg/synapse:latest@sha256:abeb932f2a9293fcbb886d5ddd0f55a34d532708ebb8dc5642934dd91ca26237
    networks:
    - private
    - egress
    entrypoint:
    - /bin/sh
    - -c
    - python /config/render_config.py /config/homeserver.yaml /data/homeserver.yaml
      && exec /start.py
    environment:
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Required}
      MATRIX_PUBLIC_URL: ${MATRIX_PUBLIC_URL:?Required}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Required}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:?Required}
      PYTHONPATH: /config
      MATRIX_MACAROON_SECRET: ${MATRIX_MACAROON_SECRET:?Required}
      MATRIX_FORM_SECRET: ${MATRIX_FORM_SECRET:?Required}
      MATRIX_OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:?Required}/realms/chatapp
      MATRIX_OIDC_CLIENT_SECRET: ${MATRIX_OIDC_CLIENT_SECRET:?Required}
      MATRIX_CALLBACK_URL: ${API_PUBLIC_URL:?Required}/v1/chat/matrix/callback
    volumes:
    - synapse_data:/data
    - ./deployment/synapse/homeserver.production.yaml:/config/homeserver.yaml:ro
    - ./deployment/synapse/render_config.py:/config/render_config.py:ro
    - ./deployment/synapse/log.config:/data/log.config:ro
    - ./deployment/synapse/matrix_log_redaction.py:/config/matrix_log_redaction.py:ro
    depends_on:
    - synapse-db
    - redis
  typesense:
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    networks:
    - private
    command:
    - --data-dir
    - /data
    - --api-key=${TYPESENSE_API_KEY:?Required}
    volumes:
    - typesense_data:/data
networks:
  private:
    internal: true
  egress: {}
volumes:
  synapse_db_data: {}
  synapse_data: {}
  redis_data: {}
  typesense_data: {}
