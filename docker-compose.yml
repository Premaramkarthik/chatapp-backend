services:
  api:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      DB_NAME: ${DB_NAME:-chatapp}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-chatapp}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-chatapp-web}
      TINODE_WEB_URL: http://tinode:6060
      TINODE_GRPC_HOST: tinode:16060
      TINODE_API_KEY: ${TINODE_API_KEY:-dev-tinode-api-key}
      TINODE_REST_AUTH_SHARED_SECRET: ${TINODE_REST_AUTH_SHARED_SECRET:-dev-tinode-rest-auth-secret}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      tinode:
        condition: service_started
      meilisearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      chatapp_DB_USER: chatapp
      chatapp_DB_PASSWORD: chatapp
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      DB_NAME: ${DB_NAME:-chatapp}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "python", "scripts/run_migrations.py"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: chatapp
      KC_DB_PASSWORD: chatapp
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  tinode:
    image: tinode/tinode-postgres:latest
    environment:
      POSTGRES_DSN: postgresql://chatapp:chatapp@postgres:5432/tinode?sslmode=disable&connect_timeout=10
      SAMPLE_DATA: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6060:6060"
      - "16060:16060"

  meilisearch:
    image: getmeili/meilisearch:v1.18
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-meili-master-key
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:7700/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025"
      - "8025:8025"

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  adminer:
    image: adminer:4
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    profiles:
      - tools

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres_data:
  meili_data:
  pgadmin_data:
