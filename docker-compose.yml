services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-keycloak-db}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # migrate:
  #   build:
  #     context: .
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: ${DB_USER:-chatapp}
  #     DB_PASSWORD: ${DB_PASSWORD:-chatapp}
  #     DB_NAME: ${DB_NAME:-chatapp}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: ["uv", "run", "python", "scripts/run_migrations.py"]
  #   restart: "no"

  keycloak:
    image: paripath-keycloak:local
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-keycloak-db}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro


  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redisinsight:
    profiles: [tools]
    image: redis/redisinsight:latest@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REDISINSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data

  synapse-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 12

  synapse:
    environment:
      PYTHONPATH: /config
    extra_hosts: ["host.docker.internal:host-gateway"]
    image: matrixdotorg/synapse:latest@sha256:abeb932f2a9293fcbb886d5ddd0f55a34d532708ebb8dc5642934dd91ca26237
    depends_on:
      synapse-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SYNAPSE_HOST_PORT:-8008}:8008"
    volumes:
      - ./docker/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./docker/synapse/log.config:/data/log.config:ro
      - ./docker/synapse/matrix_log_redaction.py:/config/matrix_log_redaction.py:ro
      - synapse_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  synapse-bootstrap:
    image: matrixdotorg/synapse:latest@sha256:abeb932f2a9293fcbb886d5ddd0f55a34d532708ebb8dc5642934dd91ca26237
    depends_on:
      synapse:
        condition: service_healthy
      synapse-db:
        condition: service_healthy
    environment:
      MATRIX_SERVICE_ADMIN_USER: ${MATRIX_SERVICE_ADMIN_USER:-connectcarry-admin}
      MATRIX_SERVICE_ADMIN_PASSWORD: ${MATRIX_SERVICE_ADMIN_PASSWORD:-dev-synapse-service-admin-change-me}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.local}
      PGHOST: synapse-db
      PGUSER: synapse
      PGPASSWORD: synapse
      PGDATABASE: synapse
      SYNAPSE_URL: http://synapse:8008
    volumes:
      - ./docker/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - synapse_data:/data
      - ./scripts/bootstrap_synapse_service_admin.sh:/scripts/bootstrap_synapse_service_admin.sh:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap_synapse_service_admin.sh"]
    restart: "no"

  typesense:
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    command: ["--data-dir", "/data", "--api-key=${TYPESENSE_API_KEY:-dev-typesense-api-key}", "--enable-cors"]
    ports:
      - "127.0.0.1:${TYPESENSE_HOST_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:8108/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # search-worker: run locally for dev (see commands below)
  # search-worker:
  #   build:
  #     context: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     typesense:
  #       condition: service_healthy
  #   environment:
  #     TYPESENSE_ENABLED: "true"
  #     TYPESENSE_HOST: typesense
  #     TYPESENSE_PORT: "8108"
  #     TYPESENSE_PROTOCOL: http
  #     TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
  #     REDIS_URL: redis://redis:6379/0
  #     DB_HOST: postgres
  #     DB_PORT: "5432"
  #     DB_USER: ${DB_USER:-chatapp}
  #     DB_PASSWORD: ${DB_PASSWORD:-chatapp}
  #     DB_NAME: ${DB_NAME:-chatapp}
  #   command:
  #     [
  #       "sh",
  #       "-c",
  #       "uv run dramatiq workers.search_tasks --processes 1 --threads 2 & uv run python -m workers.outbox_poller",
  #     ]
  #   restart: unless-stopped

  # api (uvicorn): run locally for dev — `uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000`

  # reverse-proxy:
  #   image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  #   depends_on:
  #     - api
  #   ports:
  #     - "127.0.0.1:8088:80"
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  adminer:
    image: adminer:4@sha256:c1c24d89d06fcb8fc0fb5a049240dc292ff4a121ae05d7e74d64b58c421d2921
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8081:8080"
    profiles:
      - tools

  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:8@sha256:8a68677a97b8c8d1427dc915672a26d2c4a04376916a68256f53d669d6171be7
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro


volumes:
  postgres_data:
  synapse_db_data:
  synapse_data:
  redis_data:
  redisinsight_data:
  pgadmin_data:
  typesense_data:
