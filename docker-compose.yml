  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      chatapp_DB_USER: chatapp
      chatapp_DB_PASSWORD: chatapp
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # migrate:
  #   build:
  #     context: .
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: ${DB_USER:-chatapp}
  #     DB_PASSWORD: ${DB_PASSWORD:-chatapp}
  #     DB_NAME: ${DB_NAME:-chatapp}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: ["uv", "run", "python", "scripts/run_migrations.py"]
  #   restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: chatapp
      KC_DB_PASSWORD: chatapp
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro


  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  tinode:
    image: tinode/tinode-postgres:latest
    environment:
      POSTGRES_DSN: postgresql://chatapp:chatapp@postgres:5432/tinode?sslmode=disable&connect_timeout=10
      SAMPLE_DATA: ""
      EXT_CONFIG: /etc/tinode/tinode.conf
      STORE_USE_ADAPTER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6060:6060"
      - "16060:16060"
    volumes:
      - ./docker/tinode/tinode.conf:/etc/tinode/tinode.conf:ro

  meilisearch:
    image: getmeili/meilisearch:v1.18
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-meili-master-key
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:7700/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12


  # reverse-proxy:
  #   image: nginx:1.27-alpine
  #   depends_on:
  #     - api
  #   ports:
  #     - "8088:80"
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  adminer:
    image: adminer:4
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    profiles:
      - tools

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.2
    profiles:
      - observability
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.4.2
    profiles:
      - observability
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    profiles:
      - observability
    volumes:
      - ./docker/observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/chatapp:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.7.1
    profiles:
      - observability
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles:
      - observability
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  meili_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
