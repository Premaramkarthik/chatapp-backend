  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: ["uv", "run", "python", "scripts/run_migrations.py"]
  #   restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: chatapp
      KC_DB_PASSWORD: chatapp
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro


  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDISINSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data

  synapse-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init-syncv3-db.sh:/docker-entrypoint-initdb.d/20-init-syncv3-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 12

  synapse:
    image: matrixdotorg/synapse:latest
    depends_on:
      synapse-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SYNAPSE_HOST_PORT:-8008}:8008"
      - "${SYNAPSE_METRICS_PORT:-9001}:9000"
    volumes:
      - ./docker/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./docker/synapse/log.config:/data/log.config:ro
      - synapse_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  sliding-sync:
    image: ghcr.io/matrix-org/sliding-sync:latest
    depends_on:
      synapse:
        condition: service_healthy
      synapse-db:
        condition: service_healthy
    ports:
      - "${SLIDING_SYNC_HOST_PORT:-8090}:8090"
    environment:
      SYNCV3_SERVER: http://synapse:8008
      SYNCV3_DB: postgres://synapse:synapse@synapse-db:5432/syncv3?sslmode=disable
      SYNCV3_SECRET: ${SLIDING_SYNC_SECRET:-dev-sliding-sync-secret-change-me}
      SYNCV3_BINDADDR: 0.0.0.0:8090
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -o /dev/null -X POST http://127.0.0.1:8090/_matrix/client/unstable/org.matrix.msc3575/sync -w '%{http_code}' | grep -q 401",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  synapse-bootstrap:
    image: matrixdotorg/synapse:latest
    depends_on:
      synapse:
        condition: service_healthy
      synapse-db:
        condition: service_healthy
    environment:
      MATRIX_SERVICE_ADMIN_USER: ${MATRIX_SERVICE_ADMIN_USER:-connectcarry-admin}
      MATRIX_SERVICE_ADMIN_PASSWORD: ${MATRIX_SERVICE_ADMIN_PASSWORD:-dev-synapse-service-admin-change-me}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.local}
      PGHOST: synapse-db
      PGUSER: synapse
      PGPASSWORD: synapse
      PGDATABASE: synapse
      SYNAPSE_URL: http://synapse:8008
    volumes:
      - ./docker/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - synapse_data:/data
      - ./scripts/bootstrap_synapse_service_admin.sh:/scripts/bootstrap_synapse_service_admin.sh:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap_synapse_service_admin.sh"]
    restart: "no"

  typesense:
    image: typesense/typesense:30.2
    command: ["--data-dir", "/data", "--api-key=${TYPESENSE_API_KEY:-dev-typesense-api-key}", "--enable-cors"]
    ports:
      - "${TYPESENSE_HOST_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:8108/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # search-worker: run locally for dev (see commands below)
  # search-worker:
  #   build:
  #     context: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     typesense:
  #       condition: service_healthy
  #   environment:
  #     TYPESENSE_ENABLED: "true"
  #     TYPESENSE_HOST: typesense
  #     TYPESENSE_PORT: "8108"
  #     TYPESENSE_PROTOCOL: http
  #     TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
  #     REDIS_URL: redis://redis:6379/0
  #     DB_HOST: postgres
  #     DB_PORT: "5432"
  #     DB_USER: ${DB_USER:-chatapp}
  #     DB_PASSWORD: ${DB_PASSWORD:-chatapp}
  #     DB_NAME: ${DB_NAME:-chatapp}
  #   command:
  #     [
  #       "sh",
  #       "-c",
  #       "uv run dramatiq workers.search_tasks --processes 1 --threads 2 & uv run python -m workers.outbox_poller",
  #     ]
  #   restart: unless-stopped

  # api (uvicorn): run locally for dev — `uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000`

  # reverse-proxy:
  #   image: nginx:1.27-alpine
  #   depends_on:
  #     - api
  #   ports:
  #     - "8088:80"
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  adminer:
    image: adminer:4
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    profiles:
      - tools

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.2
    profiles:
      - observability
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.4.2
    profiles:
      - observability
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    profiles:
      - observability
    volumes:
      - ./docker/observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/chatapp:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.7.1
    profiles:
      - observability
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles:
      - observability
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  postgres_data:
  synapse_db_data:
  synapse_data:
  redis_data:
  redisinsight_data:
  pgadmin_data:
  typesense_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
