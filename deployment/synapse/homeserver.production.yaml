server_name: ${MATRIX_SERVER_NAME}
pid_file: /data/homeserver.pid
web_client_location: https://app.element.io/
public_baseurl: ${MATRIX_PUBLIC_URL}
serve_server_wellknown: true
listeners:
- port: 8008
  tls: false
  type: http
  x_forwarded: true
  resources:
  - names:
    - client
    - federation
    compress: false
database:
  name: psycopg2
  allow_unsafe_locale: false
  args:
    user: synapse
    password: ${SYNAPSE_DB_PASSWORD}
    database: synapse
    host: synapse-db
    cp_min: 5
    cp_max: 10
redis:
  enabled: true
  host: redis
  port: 6379
enable_registration: false
enable_registration_without_verification: false
registration_shared_secret: ${MATRIX_REGISTRATION_SHARED_SECRET}
macaroon_secret_key: ${MATRIX_MACAROON_SECRET}
form_secret: ${MATRIX_FORM_SECRET}
signing_key_path: /data/homeserver.signing.key
trusted_key_servers:
- server_name: matrix.org
suppress_key_server_warning: true
max_upload_size: 100M
media_store_path: /data/media_store
url_preview_enabled: false
encryption_enabled_by_default_for_room_type: invite
rc_message:
  per_second: 10
  burst_count: 50
rc_registration:
  per_second: 0.17
  burst_count: 3
rc_login:
  address:
    per_second: 1
    burst_count: 100
  account:
    per_second: 1
    burst_count: 100
  failed_attempts:
    per_second: 0.5
    burst_count: 20
search:
  enabled: true
report_stats: false
enable_admin_api: true

oidc_providers:
- idp_id: keycloak
  idp_name: Veliqone
  issuer: ${MATRIX_OIDC_ISSUER}
  client_id: veliqone-matrix
  client_secret: ${MATRIX_OIDC_CLIENT_SECRET}
  pkce_method: always
  scopes: [openid, profile]
  enable_registration: false
  allow_existing_users: false
  user_mapping_provider:
    config:
      subject_claim: sub
      localpart_template: "{{ user.sub }}"

log_config: /data/log.config
