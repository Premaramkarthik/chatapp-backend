# Synapse homeserver config for local/dev (chatapp-backend).
# Production: replace secrets, TLS, and public_baseurl.

server_name: "matrix.local"
pid_file: /data/homeserver.pid
web_client_location: https://app.element.io/
public_baseurl: http://localhost:8008/
serve_server_wellknown: true

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  allow_unsafe_locale: true  # dev only; synapse-db volume may use en_US.utf8
  args:
    user: synapse
    password: synapse
    database: synapse
    host: synapse-db
    cp_min: 5
    cp_max: 10

redis:
  enabled: true
  host: redis
  port: 6379

enable_registration: false
enable_registration_without_verification: false
registration_shared_secret: "dev-synapse-registration-secret-change-me"

macaroon_secret_key: "dev-synapse-macaroon-secret-change-me-in-prod"
form_secret: "dev-synapse-form-secret-change-me-in-prod"

signing_key_path: /data/matrix.local.signing.key

trusted_key_servers:
  - server_name: matrix.org

suppress_key_server_warning: true

max_upload_size: 100M
media_store_path: /data/media_store
url_preview_enabled: false

# Valid values: "all", "invite", "off" (Synapse 1.100+; "private" was removed)
encryption_enabled_by_default_for_room_type: invite

rc_message:
  per_second: 10
  burst_count: 50

rc_registration:
  per_second: 0.17
  burst_count: 3

# ponytail: relaxed for local dev — uvicorn --reload logs in on every startup
rc_login:
  address:
    per_second: 1
    burst_count: 100
  account:
    per_second: 1
    burst_count: 100
  failed_attempts:
    per_second: 0.5
    burst_count: 20

search:
  enabled: true

report_stats: false

enable_admin_api: true

# Accounts are explicitly bound by the application through external_ids.
oidc_providers:
  - idp_id: keycloak
    idp_name: Veliqone
    issuer: http://localhost:8080/realms/chatapp
    discover: false
    skip_verification: true  # HTTP metadata endpoints are local-development only
    client_id: veliqone-matrix
    client_secret: dev-matrix-oidc-change-me
    authorization_endpoint: http://localhost:8080/realms/chatapp/protocol/openid-connect/auth
    token_endpoint: http://keycloak:8080/realms/chatapp/protocol/openid-connect/token
    userinfo_endpoint: http://keycloak:8080/realms/chatapp/protocol/openid-connect/userinfo
    jwks_uri: http://keycloak:8080/realms/chatapp/protocol/openid-connect/certs
    pkce_method: always
    scopes: [openid, profile]
    enable_registration: false
    allow_existing_users: false
    user_mapping_provider:
      config:
        subject_claim: sub
        localpart_template: "{{ user.sub }}"
sso:
  client_whitelist: ["http://localhost:8000/v1/chat/matrix/callback?"]

log_config: /data/log.config
