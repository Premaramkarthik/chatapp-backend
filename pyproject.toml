[project]
name = "chatapp-backend"
version = "0.1.0"
description = "chatapp backend foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.116.0",
    "grpcio>=1.80.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "meilisearch>=0.34.0",
    "pre-commit>=4.6.0",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.10.1",
    "pylint>=4.0.5",
    "python-dotenv>=1.1.1",
    "redis>=5.2.0",
    "ruff>=0.15.13",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "grpcio-tools>=1.80,<1.81",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"infrastructure/tinode/generated/**" = ["ALL"]
