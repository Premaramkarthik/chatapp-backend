[project]
name = "chatapp-backend"
version = "0.1.0"
description = "chatapp backend foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.116.0",
    "grpcio>=1.80.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-instrumentation-asyncpg>=0.51b0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
    "prometheus-client>=0.21.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pre-commit>=4.6.0",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.10.1",
    "pylint>=4.0.5",
    "python-dotenv>=1.1.1",
    "redis>=5.2.0",
    "ruff>=0.15.13",
    "uvicorn[standard]>=0.35.0",
    "countrystatecity-countries>=1.0.3",
    "typesense>=2.0.0",
    "dramatiq[redis]>=1.17.0",
    "matrix-nio[e2e]>=0.25.2",
    "tqdm>=4.68.2",
]
dev = [
    "black>=25.11.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: real Postgres + Keycloak (docker-compose required)",
    "e2e: full SMTP + email verification (Gmail creds required)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
